<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A social media app where users can register, log in, manage posts, view profiles, and follow other users."
    />
    <title>CHATTA Links | Home</title>
    <script
      src="https://kit.fontawesome.com/bfed71705b.js"
      crossorigin="anonymous"
    ></script>
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="assets/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="assets/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="assets/favicon-16x16.png"
    />
    <link rel="manifest" href="assets/site.webmanifest" />
    <link rel="stylesheet" href="css/style.css" />
    <script src="scripts/main.js" type="module"></script>
  </head>

  <body class="grid min-h-screen grid-rows-[auto_1fr_auto] bg-gray-100">
    <header class="bg-white shadow-lg">
      <div class="container mx-auto px-4">
        <div class="flex items-center">
          <a href="/" class="flex items-center">
            <span class="h-auto w-20">
              <img src="assets/chatta-links-logo.png" alt="CHATTA Links logo"
            /></span>
          </a>
        </div>
      </div>
    </header>

    <main
      class="container mx-auto flex flex-col items-center justify-center px-4 py-12"
    >
      <h1 class="mb-8 text-center text-3xl font-bold text-gray-800">
        Welcome to <span class="text-amber-500">CHATTA Links</span>
      </h1>
      <div class="w-full max-w-md rounded-2xl bg-white p-8 shadow-lg">
        <form class="space-y-5" action="/profile/index.html" method="get">
          <div>
            <label
              class="mb-1 block text-sm font-medium text-gray-600"
              for="email"
              >Email</label
            >
            <input
              class="w-full rounded-lg border border-gray-300 px-4 py-2 text-xs focus:ring-2 focus:ring-amber-400 focus:outline-none"
              type="email"
              id="email"
              name="email"
              placeholder="example@stud.noroff.no"
              required
            />
          </div>
          <div>
            <label
              class="mb-1 block text-sm font-medium text-gray-600"
              for="password"
              >Password</label
            >
            <input
              class="w-full rounded-lg border border-gray-300 px-4 py-2 text-xs focus:ring-2 focus:ring-amber-400 focus:outline-none"
              type="password"
              id="password"
              name="password"
              minlength="8"
              placeholder="Enter password (min 8 characters)"
              required
            />
          </div>
          <button
            class="text-md w-full rounded-lg border-2 border-amber-500 bg-white py-2 font-semibold shadow-md transition duration-300 hover:border-none hover:bg-amber-600 hover:text-white focus:ring-2 focus:ring-amber-400 focus:outline-none active:bg-amber-700 disabled:opacity-50"
            type="submit"
            name="action"
            value="login"
          >
            Log In
          </button>
          <button
            class="text-md w-full rounded-lg bg-amber-500 py-2 font-semibold text-white shadow-md transition hover:bg-amber-600 hover:text-white focus:ring-2 focus:ring-amber-400 focus:outline-none active:bg-amber-700 disabled:opacity-50"
            type="submit"
            name="action"
            value="register"
          >
            Register
          </button>
        </form>
      </div>
    </main>

    <footer class="bg-white py-8 shadow-inner">
      <div class="container mx-auto space-y-4 text-center">
        <a href="index.html">
          <img
            src="assets/chatta-links-logo.png"
            alt="CHATTA Links logo"
            class="m-auto h-auto w-20"
          />
        </a>

        <div class="flex justify-center space-x-6 text-gray-600">
          <a href="index.html" class="hover:text-amber-600">Home</a>
          <a href="terms/index.html" class="hover:text-amber-600">Terms</a>
          <a href="privacy/index.html" class="hover:text-amber-600">Privacy</a>
        </div>
        <div class="flex justify-center space-x-5 text-xl text-gray-500">
          <a href="https://www.facebook.com" aria-label="Link to Facebook">
            <i class="fa-brands fa-square-facebook hover:text-amber-600"></i>
          </a>
          <a href="https://www.instagram.com" aria-label="Link to Instagram">
            <i class="fa-brands fa-square-instagram hover:text-amber-600"></i>
          </a>
          <a href="https://www.youtube.com" aria-label="Link to YouTube">
            <i class="fa-brands fa-square-youtube hover:text-amber-600"></i>
          </a>
          <a href="https://www.tiktok.com" aria-label="Link to TikTok">
            <i class="fa-brands fa-tiktok hover:text-amber-600"></i>
          </a>
          <a href="https://x.com" aria-label="Link to x (formerly Twitter)">
            <i class="fa-brands fa-square-x-twitter hover:text-amber-600"></i>
          </a>
        </div>
        <p class="text-sm text-gray-400">
          Copyright &copy; CHATTALinksLtd 2026
        </p>
      </div>
    </footer>
  </body>
</html>
